syntax = "proto3";

package google.cloud.bigtable.emulator;

import "google/bigtable/admin/v2/table.proto";

// Everything the persistent backend stores about a table, under one key in
// the table's default column family.
message TableMetadata {
  google.bigtable.admin.v2.Table schema = 1;
  State state = 2;
  Intent intent = 3;
}

enum State {
  STATE_UNSPECIFIED = 0;
  STATE_CREATING = 1;
  STATE_ACTIVE = 2;
  STATE_DELETING = 3;
}

// Set between the two commits of a ModifyColumnFamilies that empties
// families; replayed at startup if the second commit is missing.
message Intent {
  repeated string families_to_empty = 1;
}
